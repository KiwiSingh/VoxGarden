name: Windows x64
on:
  workflow_dispatch:
  push:
    branches: [windows-port]
permissions:
  contents: read
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-only]') }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ThirdParty
          key: windows-pinned-deps-f72bad64-7bb1c8f3-88061fd4
      - name: Pinned dependencies
        shell: bash
        run: bash prepare-deps.sh
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build VST3, standalone and checks
        run: cmake --build build --config Release --target VoxGarden_VST3 VoxGarden_Standalone VoxGardenCheck --parallel 4
      - name: Native checks and screenshots
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force validation | Out-Null
          & build/VoxGardenCheck_artefacts/Release/VoxGardenCheck.exe "$pwd/build/VoxGarden_artefacts/Release/VST3/VoxGarden.vst3" "$pwd/validation/screenshots" 2>&1 | Tee-Object validation/Native-checks.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: pluginval strictness 10
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip' -OutFile pluginval.zip
          if ((Get-FileHash pluginval.zip -Algorithm SHA256).Hash.ToLower() -ne 'c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab') { throw 'Validator checksum mismatch' }
          Expand-Archive pluginval.zip pluginval
          $Validator = (Get-ChildItem pluginval -Recurse -Filter pluginval.exe | Select-Object -First 1).FullName
          & $Validator --strictness-level 10 --validate "$pwd/build/VoxGarden_artefacts/Release/VST3/VoxGarden.vst3" 2>&1 | Tee-Object validation/Pluginval.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: In-plugin neural setup (CPU test runner)
        shell: pwsh
        env:
          VOXGARDEN_CPU_ONLY: '1'
        run: |
          & build/VoxGardenCheck_artefacts/Release/VoxGardenCheck.exe --neural-setup 2>&1 | Tee-Object validation/Neural-setup.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:APPDATA/VoxGarden/Singing/python/Scripts/python.exe" -X utf8 Singing/test_runtime.py 2>&1 | Tee-Object validation/Singing-runtime-checks.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & build/VoxGardenCheck_artefacts/Release/VoxGardenCheck.exe --neural-smoke "$pwd/validation/neural" 2>&1 | Tee-Object validation/Neural-smoke.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Collect setup diagnostics
        if: always()
        shell: pwsh
        run: |
          $Root = Join-Path $env:APPDATA 'VoxGarden/Singing'
          if (Test-Path $Root) { Get-ChildItem $Root -File | Where-Object { $_.Extension -in '.log','.json','.txt' } | Copy-Item -Destination validation }
      - name: Package
        shell: pwsh
        run: ./Windows/Package.ps1 -BuildDir build -OutputDir dist
      - name: Installer smoke test
        shell: pwsh
        run: |
          $Root = "$pwd/dist/VoxGarden-3.0.0-Windows-x64-preview"
          & "$Root/Install.ps1"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$Root/Install.ps1"
          $Source = (Get-ChildItem "$Root/Plugins/VoxGarden.vst3" -Recurse -Filter *.vst3 | Where-Object { !$_.PSIsContainer } | Select-Object -First 1).FullName
          $Installed = (Get-ChildItem "$env:CommonProgramFiles/VST3/VoxGarden.vst3" -Recurse -Filter *.vst3 | Where-Object { !$_.PSIsContainer } | Select-Object -First 1).FullName
          if ((Get-FileHash $Source).Hash -ne (Get-FileHash $Installed).Hash) { throw 'Installed plugin differs from package' }
          if (!(Get-ChildItem "$env:LOCALAPPDATA/VoxGarden/Backups" -Directory)) { throw 'Installer failed to back up previous plugin' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VoxGarden-Windows-x64
          path: |
            dist/*
            validation/**
            build/**/*.log
  mac-regression:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-only]') }}
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Pinned dependencies
        run: bash prepare-deps.sh
      - name: Build existing macOS path
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target VoxGarden_VST3 VoxGardenCheck --parallel 3
      - name: Native regression checks
        run: build/VoxGardenCheck_artefacts/Release/VoxGardenCheck build/VoxGarden_artefacts/Release/VST3/VoxGarden.vst3
  runtime-diagnostics:
    if: contains(github.event.head_commit.message, '[runtime-only]')
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test private Windows bootstrap
        shell: pwsh
        env:
          VOXGARDEN_CPU_ONLY: '1'
        run: |
          New-Item -ItemType Directory -Force runtime-test | Out-Null
          Copy-Item Singing/runtime.py,Singing/model-manifest.json runtime-test
          & "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -ExecutionPolicy Bypass -File Singing/bootstrap.ps1 -Root "$pwd/runtime-test" 2>&1 | Tee-Object runtime-test/Bootstrap.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-runtime-diagnostics
          path: |
            runtime-test/*.log
            runtime-test/*.txt
            runtime-test/*.json
